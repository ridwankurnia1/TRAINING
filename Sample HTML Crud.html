<!DOCTYPE html>
<html lang="en" ng-app="crudApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRUD with AngularJS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" ng-controller="CrudController as ctrl">
        <h1>AngularJS Simple CRUD Example</h1>

        <!-- Add / Update Form -->
        <form ng-submit="ctrl.saveData()">
            <input type="hidden" ng-model="ctrl.user.id" />
            <label for="name">Name:</label>
            <input type="text" id="name" ng-model="ctrl.user.name" placeholder="Enter name" required />
            <br /><br />
            <label for="email">Email:</label>
            <input type="email" id="email" ng-model="ctrl.user.email" placeholder="Enter email" required />
            <br /><br />
            <button type="submit">Save</button>
        </form>

        <hr />
        
        <!-- Display Users -->
        <h3>User List</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="user in ctrl.users">
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <button ng-click="ctrl.editUser(user)">Edit</button>
                        <button ng-click="ctrl.deleteUser(user.id)">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- AngularJS and app scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
